# What this repository publishes: the ESPC SCALAR fields, and nothing else.
#
# Sea surface temperature, salinity, height, sea ice concentration and
# thickness, temperature at 30 m and ocean heat content — all from the same
# US Navy ESPC-D-V02 run the currents come off,
# and all cheap. The currents themselves are `espc-model-repo`, which is the
# ESPC **currents** repository despite its name (a legacy exception, kept
# because its URL is a live origin that a rename would 404).
#
# **Why the split, measured rather than chosen** (`espc-model-repo`'s
# `DECISIONS.md` D2, 2026-08-30). The axis that costs bytes is vectors against
# scalars: that repository's tile tier is 738.7 MB over ten sets — two leads
# each for surface, 50 m and the three caps — which is 89% of its own bytes.
# A 2-D scalar field is 44-58 MB. Putting the original five roots (seven
# since 2026-08-31, with the 30 m temperature and heat content) into
# `espc-model-repo` lands at 982 MB against a 1 GB Pages cap: 96%, about
# 42 MB spare, which is less than one current frame. Split off from the
# currents they sit at 150.3 MB, 14.7%, or 195.3 MB with the upper-ocean heat
# content layer that is expected to join them.
#
# So the split does not merely fit. It is what UNBLOCKED these products, which
# could not move anywhere while the only ESPC repository was already at 96%.
#
# **They arrive from `realtime-data-repo`, 2026-08-31**, which then has one
# subject — observations — rather than observations plus one model's output.
# That is the same argument that created `espc-model-repo` on 2026-08-22,
# applied a second time; and the ice staying behind on that occasion was
# explicitly a live test that moving one product between repositories is
# cheap. This is that test being cashed.
#
# Two rules this file has to satisfy, both learned in the repository these
# products came from:
#
# - **Every `roots` entry here must be one the site's `test-schema.mjs
#   --roots` publishes.** The orchestrator exits 2 on a root declared here
#   that the contract does not know, and stops the publish. It does *not*
#   fail on the reverse — a contract root this repository has no product for
#   is the ordinary case, because five other origins own most of them. The
#   union across origins is held by `check:docs` on the site, which is the
#   only side that can see every declaration at once.
# - **A product that leaves takes its files with it.** The stage is seeded
#   from the last publish, so a root a pipeline stops writing is carried
#   forward for ever. That is the other half of this migration and it happens
#   in `realtime-data-repo`, not here.
#
# **The ESPC hour rule spans two origins and only the site can enforce
# it.** Twelve roots have to agree on the model run's anchor: the seven here
# and the five in `espc-model-repo`. The one arrangement that would let a
# single pipeline check that — all twelve in one repository — is exactly what the
# storage cap forbids, so cross-origin enforcement is permanent rather than a
# stage toward something tidier. It works because the anchor is a pure
# function of time: the rule already agrees WITHOUT the origins coordinating,
# and what splitting costs is the gate, not the agreement.

# **The paths are relative to the site checkout, not to this workspace.** The
# orchestrator runs both of these with the site checkout as their working
# directory, so `site/scripts/...` would look right and resolve to nothing.
[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

# 30, which is what these products get in the repository they are moving from.
# A shorter default would have changed a product's behavior as a side effect
# of moving it, which is the one thing a move must not do — even though this
# fetch is far shorter than the currents fetch the number was chosen for.
[defaults]
timeout_minutes = 30

# --- steps ------------------------------------------------------------------
# `lane` names the upstream a step leans on. Steps in different lanes run
# concurrently; steps in the same lane queue. Two HYCOM reads competing for
# the same THREDDS server help nobody, least of all HYCOM.
#
# One step, three products. The fetch is shared; the fates, namespaces, tiles
# and holds are per product, which is the boundary that lets a clean
# temperature publish while a broken ice read is held.
#
# **`--only` on the STEP, and the first run here is what taught it.** The
# script publishes ten families (`PRODUCTS` in `fetch-ocean-fields.py`) — the
# seven this repository owns and OISST's three, which stayed in
# `realtime-data-repo`. Invoked bare it fetches all of them, so the first run wrote `sst-oisst.json`, `sic-oisst.json` and
# `ssta-oisst.json` into a tree where no product declares them, and the write
# fence refused the run outright: `FENCE  sst-oisst.json: written by no
# declared namespace`. Correct, and loud, and exactly what that fence is for.
#
# **The lesson generalizes past this repository.** A product is the unit of
# ownership and a STEP is the unit of execution, and splitting one script's
# families across repositories splits the first without splitting the second.
# The per-product `namespace`, `tiles` and `tile-key` commands were already
# scoped — it is the step's own `cmd` that is easy to miss, because in the
# repository these products came from it had no reason to be scoped: every
# family the script wrote had an owner there.
[steps.fields]
cmd = ["python3", "scripts/fetch-ocean-fields.py", "--only=sst-navy,sss-navy,sic-navy,sit-navy,ssh-navy,temp30-navy,ohc-navy"]
lane = "hycom"

[products.fields-navy]
title = "Navy ESPC temperature and salinity"
step = "fields"
roots = ["sst-navy.json", "sss-navy.json"]
writes = ["sst-navy*.json", "sss-navy*.json"]
# Two, not nine. These are ESPC 3-hourly products and the anchor
# publishes frames that BRACKET the reader, so the nearest is at
# most 1.5 h away by construction (see REFRESH_HOURS in
# fetch-currents.py). Two leaves room for a late run without
# hiding the nine-hour case this was blind to.
max_age_hours = 2
namespace = ["python3", "scripts/fetch-ocean-fields.py", "--namespace", "--only=sst-navy,sss-navy"]

[products.fields-navy.tiles]
build = ["python3", "scripts/fetch-ocean-fields.py", "--tiles", "--only=sst-navy,sss-navy"]
key = ["python3", "scripts/fetch-ocean-fields.py", "--tile-key", "--only=sst-navy,sss-navy"]
cache = "field-tiles"
match = [
  ["tiles-sst-navy", "sst-navy.json"],
  ["tiles-sss-navy", "sss-navy.json"],
]

[products.ice-navy]
title = "Navy ESPC sea ice concentration and thickness"
step = "fields"
roots = ["sic-navy.json", "sit-navy.json"]
writes = ["sic-navy*.json", "sit-navy*.json"]
# Two, not nine. These are ESPC 3-hourly products and the anchor
# publishes frames that BRACKET the reader, so the nearest is at
# most 1.5 h away by construction (see REFRESH_HOURS in
# fetch-currents.py). Two leaves room for a late run without
# hiding the nine-hour case this was blind to.
max_age_hours = 2
namespace = ["python3", "scripts/fetch-ocean-fields.py", "--namespace", "--only=sic-navy,sit-navy"]

# **Its own cache, and it has to be.** `plan` writes one
# `cache-key-<cache>` per product, so two products sharing a name would
# write that output twice and the workflow would read whichever came last —
# a key describing half of what the cache holds, which is the
# incomplete-artifact-under-a-complete-key fault that cannot heal by
# itself. A new cache name needs a **Restore** and a **Save** step in the
# workflow; `plan` says so out loud when one has neither, because a cache
# nothing restores is invisible — the tiles are simply rebuilt every run.
[products.ice-navy.tiles]
build = ["python3", "scripts/fetch-ocean-fields.py", "--tiles", "--only=sic-navy,sit-navy"]
key = ["python3", "scripts/fetch-ocean-fields.py", "--tile-key", "--only=sic-navy,sit-navy"]
cache = "ice-tiles"
match = [
  ["tiles-sic-navy", "sic-navy.json"],
  ["tiles-sit-navy", "sit-navy.json"],
]

# **Sea surface height, its own product because it is its own
# aggregation.** `surf_el` comes off `FMRC_ESPC-D-V02_ssh` while the
# temperature and salinity come off `ts3z`, so it can fail on its own and
# should be held on its own — which is what a product is for. It shares the
# `fields` step, the same arrangement the other two here have.
#
# No tile tier: a free surface is a smooth field, and the region stride at
# 0.16 deg already resolves the mesoscale eddies a reader looks for. See the
# note on the product in `fetch-ocean-fields.py`.
[products.ssh-navy]
title = "Navy ESPC sea surface height"
step = "fields"
roots = ["ssh-navy.json"]
writes = ["ssh-navy*.json"]
# Two, not nine. These are ESPC 3-hourly products and the anchor
# publishes frames that BRACKET the reader, so the nearest is at
# most 1.5 h away by construction (see REFRESH_HOURS in
# fetch-currents.py). Two leaves room for a late run without
# hiding the nine-hour case this was blind to.
max_age_hours = 2
namespace = ["python3", "scripts/fetch-ocean-fields.py", "--namespace", "--only=ssh-navy"]

# **Temperature at 30 m, its own product because it is its own read.** Fates
# follow upstream reads — the rule that split the currents into three — and
# this is a separate level request from the surface temperature, so a failure
# in one should not hold the other.
#
# It shares a tile tier's argument with the surface temperature: the same
# 1/12 deg grid, and the region stride would render it no finer than a
# quarter-degree analysis.
[products.temp30-navy]
title = "Navy ESPC temperature at 30 m"
step = "fields"
roots = ["temp30-navy.json"]
writes = ["temp30-navy*.json"]
max_age_hours = 2
namespace = ["python3", "scripts/fetch-ocean-fields.py", "--namespace", "--only=temp30-navy"]

# Its own cache name, for the reason `ice-navy.tiles` states: `plan` writes
# one `cache-key-<cache>` per product, so two products sharing a name would
# write that output twice and the workflow would read whichever came last.
# **A new cache name needs a Restore and a Save step in the workflow**, and
# `plan` says so out loud when a declared cache has neither.
[products.temp30-navy.tiles]
build = ["python3", "scripts/fetch-ocean-fields.py", "--tiles", "--only=temp30-navy"]
key = ["python3", "scripts/fetch-ocean-fields.py", "--tile-key", "--only=temp30-navy"]
cache = "temp30-tiles"
match = [
  ["tiles-temp30-navy", "temp30-navy.json"],
]

# **Ocean heat content — tropical cyclone heat potential.** The integral of
# (T - 26 C) from the 26 C isotherm to the surface, from a 0-300 m profile
# read. The arithmetic, the measured D26 distribution that chose 300 m, and
# what each of its three answers means are in `fetch-ocean-fields.py`.
#
# **No tile tier**, on sea surface height's argument rather than the
# temperature's: what a reader zooms into here is mesoscale, and the 0.16 deg
# region stride already resolves warm eddies and rings.
#
# Its own product for the same reason as the layer above: its read is its own,
# and it is the costliest of them — 25 levels against one — so it is the most
# likely of the five to fail alone.
[products.ohc-navy]
title = "Navy ESPC ocean heat content"
step = "fields"
roots = ["ohc-navy.json"]
writes = ["ohc-navy*.json"]
# **Six, not two, because this product deliberately skips every other
# rollover.** Its siblings take the hour the currents publish, which brackets
# the reader within 1.5 h; this one only takes a step when that hour is a
# multiple of six, so it sits up to 4.5 h from the reader by construction.
# Six leaves room for a late run without hiding a genuine outage.
#
# The cadence is the fetcher's (`cadence_hours`) and exists to make the tile
# tier affordable: 25 levels a box, rebuilt whenever the published hour moves,
# so halving the moves halves 10.8 GB a day to 5.4. Two would have marked this
# product `behind` on every run and failed the workflow after every deploy.
max_age_hours = 6
namespace = ["python3", "scripts/fetch-ocean-fields.py", "--namespace", "--only=ohc-navy"]

# **Its own cache, and its own Restore/Save pair in the workflow** — the rule
# `ice-navy.tiles` states: `plan` writes one `cache-key-<cache>` per product,
# so two products sharing a name would write that output twice and the
# workflow would read whichever came last.
#
# **The costliest tier here by a distance.** A box is 25 levels rather than
# one, about 12 MB off HYCOM, and `tileLat` bounds it to the 108 boxes that
# can hold a 26 C isotherm — so ~1.35 GB a build against the field tier's
# ~79 MB. It is spent because a tile mosaic needs no containment: it is the
# only tier that has no resolution gap at any zoom or centre, which two live
# reports of a coarse Gulf are what bought.
[products.ohc-navy.tiles]
build = ["python3", "scripts/fetch-ocean-fields.py", "--tiles", "--only=ohc-navy"]
key = ["python3", "scripts/fetch-ocean-fields.py", "--tile-key", "--only=ohc-navy"]
cache = "ohc-tiles"
match = [
  ["tiles-ohc-navy", "ohc-navy.json"],
]
